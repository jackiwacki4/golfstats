<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>kalshisportsbot</title>
<style>
  :root {
    color-scheme: light;
    --surface:   #fcfcfb;
    --plane:     #f9f9f7;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --muted:     #898781;
    --rule:      #e1e0d9;
    --axis:      #c3c2b7;

    --good:      #0ca30c;
    --warning:   #fab219;
    --serious:   #ec835a;
    --critical:  #d03b3b;
    --good-text: #006300;
    --accent:    #2a78d6;

    --radius: 10px;
    --mono: ui-monospace, "SF Mono", "IBM Plex Mono", Menlo, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface: #1a1a19;
      --plane:   #0d0d0d;
      --ink:     #ffffff;
      --ink-2:   #c3c2b7;
      --muted:   #898781;
      --rule:    #2c2c2a;
      --axis:    #383835;
      --good-text: #0ca30c;
      --accent:  #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19;
    --plane:   #0d0d0d;
    --ink:     #ffffff;
    --ink-2:   #c3c2b7;
    --muted:   #898781;
    --rule:    #2c2c2a;
    --axis:    #383835;
    --good-text: #0ca30c;
    --accent:  #3987e5;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 72px; }

  /* --- Header --------------------------------------------------------- */
  header {
    display: flex; flex-wrap: wrap; gap: 16px;
    align-items: baseline; justify-content: space-between;
    padding-bottom: 16px; border-bottom: 1px solid var(--rule); margin-bottom: 20px;
  }
  h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .theme-toggle {
    background: none; border: 1px solid var(--rule); color: var(--ink-2);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px;
  }

  /* --- Controls ------------------------------------------------------- */
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .field input, .field select {
    background: var(--plane); color: var(--ink);
    border: 1px solid var(--axis); border-radius: 6px;
    padding: 6px 8px; font-size: 14px; font-family: var(--mono); min-width: 96px;
  }
  button.run {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 9px 18px; font-size: 14px; font-weight: 600; cursor: pointer; margin-left: auto;
  }
  button.run:disabled { opacity: 0.55; cursor: progress; }

  /* --- Stat tiles ------------------------------------------------------ */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .tile { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; }
  .tile .n { font-size: 22px; font-weight: 650; font-family: var(--mono); letter-spacing: -0.02em; }
  .tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-top: 2px; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin: 28px 0 10px; }
  h2 .sub { text-transform: none; letter-spacing: 0; color: var(--muted); font-weight: 400; }

  /* --- Cards ----------------------------------------------------------- */
  .card {
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
  }
  .card-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .rank { font-family: var(--mono); color: var(--muted); font-size: 13px; min-width: 22px; }
  .pick { font-weight: 650; font-size: 16px; }
  .event { color: var(--ink-2); font-size: 13px; flex: 1 1 260px; }
  .ticker { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .row { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 10px; }
  .metric { display: flex; flex-direction: column; }
  .metric .v { font-family: var(--mono); font-size: 15px; font-weight: 600; }
  .metric .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }

  /* Edge meter: a mark, anchored at zero, rounded at the data end. */
  .meter { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .meter > i { display: block; height: 100%; border-radius: 3px; background: var(--good); }

  .why { margin-top: 10px; border-top: 1px solid var(--rule); padding-top: 8px; }
  .why div { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
  .why b { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }

  /* Status chips always pair an icon with a label — never color alone. */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    font-size: 11px; border-radius: 999px; padding: 2px 9px;
    border: 1px solid var(--axis); color: var(--ink-2); display: inline-flex; gap: 4px; align-items: center;
  }
  .chip.good     { border-color: var(--good);     color: var(--good-text); }
  .chip.warning  { border-color: var(--warning); }
  .chip.serious  { border-color: var(--serious); }
  .chip.critical { border-color: var(--critical); color: var(--critical); }

  .arb { border-left: 3px solid var(--good); }
  .legs { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); margin-top: 8px; line-height: 1.7; }

  .empty { background: var(--surface); border: 1px dashed var(--axis); border-radius: var(--radius); padding: 28px; text-align: center; color: var(--ink-2); }
  .empty strong { display: block; font-size: 16px; color: var(--ink); margin-bottom: 6px; }
  .notes { margin-top: 24px; font-size: 12.5px; color: var(--muted); }
  .notes div { margin-top: 3px; }
  .err { border-color: var(--critical); color: var(--critical); }

  table.detail { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12.5px; }
  table.detail th, table.detail td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--rule); }
  table.detail th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  table.detail td.num { font-family: var(--mono); }
  details summary { cursor: pointer; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .scroll { overflow-x: auto; }
  footer { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>kalshisportsbot <span>— your number vs the crowd's</span></h1>
    <button class="theme-toggle" id="theme">theme</button>
  </header>

  <div class="controls">
    <div class="field">
      <label for="minEdge">Min net edge (pts)</label>
      <input id="minEdge" type="number" value="3" min="0" max="50" step="0.5" />
    </div>
    <div class="field">
      <label for="categories">Category</label>
      <select id="categories">
        <option value="">Everything</option>
        <option value="Sports">Sports</option>
        <option value="Economics">Economics</option>
        <option value="Politics">Politics</option>
        <option value="Financials">Financials</option>
        <option value="Climate and Weather">Climate &amp; Weather</option>
      </select>
    </div>
    <div class="field">
      <label for="maxPages">Depth (pages)</label>
      <input id="maxPages" type="number" value="6" min="1" max="12" step="1" />
    </div>
    <button class="run" id="run">Run the numbers</button>
  </div>

  <div id="out"></div>

  <footer>
    Advisory only — this places no orders. Every edge shown is net of Kalshi's
    taker fee. Sizing is fractional Kelly against your configured bankroll.
  </footer>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const out = $("out");

// --- Theme toggle: must beat the OS setting in both directions ------------
const root = document.documentElement;
$("theme").addEventListener("click", () => {
  const dark = getComputedStyle(root).getPropertyValue("--plane").trim() === "#0d0d0d";
  root.setAttribute("data-theme", dark ? "light" : "dark");
});

const pct  = (x) => `${(x * 100).toFixed(1)}%`;
const pts  = (x) => `${(x * 100).toFixed(1)}`;
const cents= (x) => `${Math.round(x * 100)}¢`;
const usd  = (x) => `$${x.toFixed(2)}`;
const esc  = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/** Confidence -> status role. Icon + label carry the meaning; color reinforces. */
function confidenceChip(confidence) {
  if (confidence >= 0.6) return { cls: "good",     icon: "●", label: `strong evidence ${pct(confidence)}` };
  if (confidence >= 0.35) return { cls: "warning", icon: "◐", label: `moderate evidence ${pct(confidence)}` };
  return { cls: "serious", icon: "○", label: `thin evidence ${pct(confidence)}` };
}

function betCard(bet, index) {
  const conf = confidenceChip(bet.confidence);
  const meterWidth = Math.min(100, (bet.netEdge / 0.15) * 100);

  const flags = bet.flags.map(
    (f) => `<span class="chip serious">⚠ ${esc(f)}</span>`,
  ).join("");

  const why = bet.contributions
    .filter((c) => c.source !== "market")
    .map((c) => `<div><b>${esc(c.source)}</b> &middot; ${esc(c.rationale)}</div>`)
    .join("");

  const crowd = bet.contributions.find((c) => c.source === "market");

  return `
  <div class="card">
    <div class="card-head">
      <span class="rank">${index + 1}</span>
      <span class="pick">Buy ${bet.side.toUpperCase()} &mdash; ${esc(bet.label)}</span>
      <span class="event">${esc(bet.eventTitle)}</span>
      <span class="ticker">${esc(bet.ticker)}</span>
    </div>

    <div class="row">
      <div class="metric"><span class="v">${cents(bet.price)}</span><span class="l">price</span></div>
      <div class="metric"><span class="v">${cents(bet.fair)}</span><span class="l">our fair</span></div>
      <div class="metric"><span class="v">${pts(bet.netEdge)} pts</span><span class="l">edge (net of fees)</span></div>
      <div class="metric"><span class="v">${usd(bet.evPerContract)}</span><span class="l">EV / contract</span></div>
      <div class="metric"><span class="v">${bet.stake.contracts}</span><span class="l">contracts</span></div>
      <div class="metric"><span class="v">${usd(bet.stake.costDollars)}</span><span class="l">stake</span></div>
      <div class="metric"><span class="v" style="color:var(--good-text)">+${usd(bet.stake.winProfitDollars)}</span><span class="l">if right</span></div>
      <div class="metric"><span class="v" style="color:var(--critical)">−${usd(bet.stake.lossDollars)}</span><span class="l">if wrong</span></div>
    </div>

    <div class="meter"><i style="width:${meterWidth}%"></i></div>

    <div class="chips">
      <span class="chip ${conf.cls}">${conf.icon} ${esc(conf.label)}</span>
      <span class="chip">${esc(bet.americanOdds > 0 ? "+" + bet.americanOdds : bet.americanOdds)} offered vs ${esc(bet.fairAmericanOdds > 0 ? "+" + bet.fairAmericanOdds : bet.fairAmericanOdds)} fair</span>
      ${flags}
    </div>

    <div class="why">
      <div><b>crowd</b> &middot; Kalshi mid ${crowd ? cents(crowd.probability) : "n/a"} &mdash; we disagree by ${pts(Math.abs(bet.rawEdge))} pts.</div>
      ${why}
    </div>
  </div>`;
}

function arbCard(arb) {
  const legs = arb.legs
    .map((l) => `&nbsp;&nbsp;${l.side.toUpperCase()} ${esc(l.label)} @ ${cents(l.price)}`)
    .join("<br>");

  // Only trades whose payout doesn't depend on the legs covering every outcome
  // may be presented as locked in. The rest are conditional bets, and saying so
  // is the entire point.
  const locked = !arb.requiresExhaustive;
  const statusChip = locked
    ? `<span class="chip good">● locked in &mdash; ${esc(arb.kind)}</span>`
    : `<span class="chip critical">▲ conditional &mdash; not risk-free</span>`;

  const fieldMetric = locked
    ? ""
    : `<div class="metric"><span class="v" style="color:var(--critical)">${pct(arb.breakEvenFieldProbability)}</span><span class="l">breaks even if "none" hits</span></div>`;

  return `
  <div class="card arb" style="${locked ? "" : "border-left-color:var(--critical)"}">
    <div class="card-head">
      <span class="pick">${esc(arb.eventTitle)}</span>
      ${statusChip}
    </div>
    <div class="row">
      <div class="metric"><span class="v">${usd(arb.costPerSet)}</span><span class="l">cost / set</span></div>
      <div class="metric"><span class="v">${usd(arb.payoutPerSet)}</span><span class="l">${locked ? "guaranteed payout" : "payout if a leg wins"}</span></div>
      <div class="metric"><span class="v" style="color:var(--good-text)">+${pct(arb.returnOnCost)}</span><span class="l">return on cost</span></div>
      ${fieldMetric}
      <div class="metric"><span class="v">${arb.legs.length}</span><span class="l">legs</span></div>
    </div>
    <div class="legs">${legs}</div>
    <div class="chips"><span class="chip ${locked ? "warning" : "critical"}">⚠ ${esc(arb.note)}</span></div>
  </div>`;
}

function render(data) {
  const s = data.stats;
  const tiles = [
    [s.marketsScanned.toLocaleString(), "markets scanned"],
    [s.marketsTradeable.toLocaleString(), "tradeable"],
    [s.marketsWithSignal.toLocaleString(), "with a signal"],
    [s.consensusMatched.toLocaleString(), "matched to books"],
    [data.bets.length, "bets found"],
    [data.arbitrage.length, "structural edges"],
  ].map(([n, k]) => `<div class="tile"><div class="n">${n}</div><div class="k">${k}</div></div>`).join("");

  const arbSection = data.arbitrage.length
    ? `<h2>Structural edges <span class="sub">— price arithmetic; check each card for whether the payout is locked in or conditional</span></h2>
       ${data.arbitrage.map(arbCard).join("")}`
    : "";

  const betSection = data.bets.length
    ? `<h2>Best bets <span class="sub">— ranked by edge, discounted for weak evidence and thin books</span></h2>
       ${data.bets.map(betCard).join("")}`
    : `<h2>Best bets</h2>
       <div class="empty">
         <strong>Nothing clears the bar right now.</strong>
         This is a real answer, not a failure. An efficient board means the
         correct play is to pass — forcing a bet here is exactly the habit
         that makes Kalshi profitable for everyone but you.
       </div>`;

  const notes = data.notes.length
    ? `<div class="notes">${data.notes.map((n) => `<div>· ${esc(n)}</div>`).join("")}</div>`
    : "";

  out.innerHTML = `
    <div class="tiles">${tiles}</div>
    ${arbSection}
    ${betSection}
    ${notes}
    <div class="notes"><div>Scanned in ${(data.durationMs / 1000).toFixed(1)}s &middot;
    ${new Date(data.generatedAt).toLocaleTimeString()} &middot; bankroll ${usd(data.bankroll)}</div></div>`;
}

async function run() {
  const button = $("run");
  button.disabled = true;
  button.textContent = "Running…";
  out.innerHTML = `<div class="empty">Pulling live markets and running the numbers…</div>`;

  const params = new URLSearchParams({
    minEdge: $("minEdge").value,
    maxPages: $("maxPages").value,
  });
  if ($("categories").value) params.set("categories", $("categories").value);

  try {
    const response = await fetch(`/api/scan?${params}`);
    const data = await response.json();
    if (data.error) throw new Error(data.error);
    render(data);
  } catch (err) {
    out.innerHTML = `<div class="empty err"><strong>Scan failed</strong>${esc(err.message)}</div>`;
  } finally {
    button.disabled = false;
    button.textContent = "Run the numbers";
  }
}

$("run").addEventListener("click", run);
run();
</script>
</body>
</html>
