profile: |
  TPC Twin Cities is a birdie course, and it does not pretend otherwise. Arnold
  Palmer routed it across former farmland and wetland north of Minneapolis, and
  water is in play on the majority of holes — but the water rarely sits between
  you and a good score. It frames, it intimidates, and once or twice a week it
  swallows a bad swing whole. Mostly it just looks dangerous.

  The tee shots are wide enough that distance is a convenience rather than a
  weapon. What decides the week is the wedge. Players spend the round staring at
  100-to-150-yard approaches, and the leaderboard sorts itself by who is stuffing
  those to tap-in range and who is settling for twenty feet. Proximity from inside
  150 is the single number that best predicts a good week here.

  The par 5s are reachable and the greens are large, so the ceiling for a hot round
  is very high — someone will go low, probably more than once. The credible read is
  never "who survives" but "who can keep the foot down for four days without the
  one loose finish near the water that costs a stroke the birdies can't buy back."
