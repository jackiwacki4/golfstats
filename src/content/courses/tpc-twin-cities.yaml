demands:
  # Distance helps but does not separate the field — the corridors are generous
  # and the fight is on the second shot, not off the tee.
  drivingDistance: 3
  approachBuckets:
    # A wedge course. Most scoring chances arrive from inside 150, and the winner
    # is usually whoever is sharpest with the short irons.
    - range: "100-125"
